name: Build Comet OS ISO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc-multilib nasm grub-pc-bin grub-common xorriso mtools
      - name: Build
        run: make iso
      - uses: actions/upload-artifact@v4
        with:
          name: comet-os-iso
          path: comet-os.iso
